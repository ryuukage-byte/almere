<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SevnQuest English · Indonesian Learner Data Flow Map</title>
<style>
  :root{
    --bg:#0f131b; --grid:rgba(120,150,200,.07); --panel:#171d28; --panel-hi:#1c2433; --well:#121824;
    --line:rgba(120,150,200,.28); --line-strong:rgba(120,150,200,.52); --inner:rgba(120,150,200,.16);
    --text:#e6eaf3; --dim:#98a2b8; --muted:#6f7a92; --gold:#e5b93f;
    --core:#4fae86; --engine:#e5b93f; --event:#53b9dd; --state:#a78bfa; --storage:#7a96d9; --ui:#f08fc0; --optional:#8a96b0;
    --score:#52c78d; --attempt:#58a6ff; --error:#e2555b; --edge:#8a96b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:rgba(15,19,27,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  #top h1{margin:0 8px 0 0;font:750 14px/1 system-ui;letter-spacing:.04em}
  #top h1 small{display:block;margin-top:4px;font-weight:500;color:var(--muted);letter-spacing:0;font-size:10px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  button.chip{cursor:pointer;color:var(--dim);background:var(--well);border:1px solid var(--inner);border-radius:12px;padding:6px 11px;font:650 11px system-ui}
  button.chip:hover{border-color:var(--line);color:var(--text)}
  button.chip.on{background:var(--panel-hi);border-color:var(--line-strong);color:var(--text)}
  button.view.on{color:var(--gold)}
  #search{width:245px;background:var(--well);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:7px 11px;font:13px system-ui}
  #search:focus{outline:none;border-color:var(--line-strong)}
  #hint{color:var(--muted);font-size:11px}
  #viewport{position:fixed;inset:0;cursor:grab;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
  #viewport.drag{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;transform-origin:0 0}
  svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .lane{position:absolute;border:1px dashed var(--inner);border-radius:18px;background:rgba(23,29,40,.30);pointer-events:none}
  .lane span{position:absolute;left:14px;top:-9px;padding:0 8px;background:var(--bg);color:var(--muted);font:750 10px system-ui;letter-spacing:.12em}
  .node{position:absolute;width:252px;min-height:142px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
        box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--inner);padding:13px 14px 12px 16px;cursor:pointer;transition:opacity .15s,border-color .15s,transform .15s}
  .node:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .node.sel{border-color:var(--gold)}
  .node.dim{opacity:.14}
  .node.hit{border-color:var(--gold);box-shadow:0 0 0 2px rgba(229,185,63,.25),0 8px 20px rgba(0,0,0,.28),inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--inner)}
  .node::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--st,var(--muted))}
  .node .nm{font:750 13px system-ui;margin:0 0 2px;color:var(--text);padding-right:2px}
  .node .row1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
  .tag{font:750 9px system-ui;letter-spacing:.08em;padding:2px 6px;border-radius:7px;background:var(--well);border:1px solid var(--inner);color:var(--dim)}
  .st{font:750 9px system-ui;letter-spacing:.08em;padding:2px 6px;border-radius:7px;color:#0f131b;background:var(--st,var(--muted))}
  .node .src{font:10.5px ui-monospace,Consolas,monospace;color:var(--gold);word-break:break-word;margin-bottom:6px}
  .node .io{font-size:10.5px;color:var(--dim);margin-top:2px}
  .node .io b{color:var(--muted);font-weight:750;letter-spacing:.06em;font-size:9px;margin-right:4px}
  .ports{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .port{display:flex;align-items:center;gap:5px;border:1px solid var(--inner);background:var(--well);border-radius:9px;padding:3px 7px;font:700 9px/1.3 system-ui;color:var(--dim)}
  .port i{display:inline-block;width:7px;height:7px;border-radius:50%}
  .port.score i{background:var(--score)} .port.attempt i{background:var(--attempt)} .port.error i{background:var(--error)}
  .mult{color:var(--gold);font-weight:800}
  .elabel{position:absolute;transform:translate(-50%,-50%);max-width:190px;padding:2px 7px;border-radius:9px;background:var(--well);border:1px solid var(--inner);color:var(--dim);font:650 10px system-ui;text-align:center;pointer-events:none;transition:opacity .15s}
  .elabel.dim{opacity:.08}
  path.e{fill:none;stroke-width:1.7;transition:opacity .15s}
  path.e.dim{opacity:.06}
  #panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:94vw;z-index:40;transform:translateX(102%);transition:transform .2s;background:var(--panel);border-left:1px solid var(--line-strong);padding:62px 18px 24px;overflow:auto}
  #panel.open{transform:none}
  #panel h2{margin:0 0 4px;font:750 17px system-ui}
  #panel .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  #panel h3{margin:15px 0 5px;font:750 10px system-ui;letter-spacing:.12em;color:var(--muted)}
  #panel p,#panel li{margin:0;color:var(--dim)}
  #panel ul{margin:0;padding-left:16px}
  #panel code{font:11px ui-monospace,Consolas,monospace;color:var(--gold)}
  #panel .formula{padding:9px 10px;border:1px solid var(--inner);border-radius:10px;background:var(--well);color:var(--text);font:11px ui-monospace,Consolas,monospace}
  #panel .portbox{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  #panel .portcard{padding:8px 9px;border:1px solid var(--inner);border-radius:10px;background:var(--well);font-size:11px;color:var(--dim)}
  #panel .portcard b{display:block;color:var(--text);margin-bottom:2px}
  #close{position:absolute;top:62px;right:14px;cursor:pointer}
  #legend{position:fixed;left:14px;bottom:14px;z-index:30;background:rgba(23,29,40,.94);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;gap:10px 14px;flex-wrap:wrap;max-width:min(980px,78vw);font-size:11px;color:var(--dim)}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #legend u{display:inline-block;width:26px;border-top:2px solid var(--dim);margin-right:5px;vertical-align:3px}
  #note{position:fixed;left:14px;top:62px;z-index:25;max-width:520px;font-size:11px;color:var(--dim);background:rgba(23,29,40,.90);border:1px solid var(--inner);border-radius:12px;padding:8px 11px}
  #note b{color:var(--text)} #note code{color:var(--gold)}
  #zoom{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;gap:6px}
  @media (max-width:780px){#search{width:160px}#legend{max-width:calc(100vw - 28px)}#note{display:none}.node{width:236px}}
</style>
</head>
<body>
<div id="top">
  <h1>SEVNQUEST ENGLISH · INDONESIAN LEARNER DATA FLOW<small>English learning architecture · CEFR · Indonesia-aware errors · entity → engine → event → mastery</small></h1>
  <div class="seg" id="views"></div>
  <div class="seg" id="filters"></div>
  <input id="search" type="search" placeholder="cari: vocabulary, speaking, tense, article, CEFR…" autocomplete="off">
  <span id="hint">seret = geser · scroll = zoom · klik node = detail · / = cari</span>
</div>
<div id="note"></div>
<div id="viewport"><div id="canvas"><svg id="edges"></svg></div></div>
<aside id="panel"><button class="chip" id="close">tutup ✕</button><div id="pbody"></div></aside>
<div id="legend"></div>
<div id="zoom"><button class="chip" id="zin">＋</button><button class="chip" id="zout">－</button><button class="chip" id="zfit">fit</button></div>

<script>
const ST={CORE:'var(--core)',ENGINE:'var(--engine)',EVENT:'var(--event)',STATE:'var(--state)',STORAGE:'var(--storage)',UI:'var(--ui)',OPTIONAL:'var(--optional)'};
const GROUPS=['INGEST','LANGUAGE ENTITY','ENGINES','EVENT ROUTER','LEARNING STATE','PERSISTENCE','PROGRESSION / UI'];
const NODES={};
function N(id,name,type,group,source,inn,out,status,d={}){NODES[id]={id,name,type,group,source,inn,out,status,d,tags:(d.tags||'')}}

/* ============================ INGEST ============================ */
N('raw_import','Raw English Learning Source','DATA','INGEST','JSON / CSV / API / editor','raw word / phrase / grammar / pronunciation / sentence','raw records','CORE',{
  fields:['sourceId','rawEnglish','rawIndonesian','rawLevel','rawPronunciation','metadata'],
  features:['Import batch','Source traceability','Versioned curriculum source','Bilingual source support'],
  tags:'raw import english source indonesia bilingual json csv api'});
N('normalizer','Normalize & Validate','PROCESS','INGEST','schema validator + English normalizer','raw records','normalized entity draft','CORE',{
  features:['Lowercase/lemma candidate','Normalize apostrophe & punctuation','CEFR normalization A1–C2','POS/schema validation','Indonesian meaning cleanup','Duplicate candidate detection'],
  formula:'normalized = validate(normalize(raw))',
  tags:'normalize validate schema cefr lemma indonesia'});
N('canonicalizer','Canonical Identity Resolver','PROCESS','INGEST','entity identity layer','normalized draft','canonicalEntityId + aliases','CORE',{
  features:['1 lemma/phrase = 1 canonical ID','Inflected forms point to lemma','Alias & legacy IDs resolve to canonical entity','Prevents split mastery'],
  formula:'canonicalId = resolve(lemma + POS + senseKey)',
  tags:'canonical id lemma identity alias sense'});

/* ======================== LANGUAGE ENTITY ======================== */
N('vocab','Vocabulary / Lemma Entity','ENTITY','LANGUAGE ENTITY','english/vocabulary','canonical draft','VocabularyRecord','CORE',{
  fields:['id / canonicalId','lemma','displayForm','meaningId[]','partOfSpeech','CEFR A1–C2','frequencyBand','countability?','transitivity?','irregularForms?','collocationIds[]','phraseIds[]','pronunciationId','topicTags[]','baseValue','difficultyWeight','examples[]'],
  features:['One lexical identity','Inflection links stay under same lemma','Bilingual Indonesian meanings','Frequency + CEFR ready'],
  formula:'baseValue = cefrBase × lexicalDifficulty × frequencyWeight × curriculumWeight',
  tags:'english vocabulary lemma kosakata arti indonesia cefr part of speech base value'});
N('phrase','Phrase · Collocation · Phrasal Verb','ENTITY','LANGUAGE ENTITY','english/phrase','canonical draft','PhraseRecord','CORE',{
  fields:['id','surface','type: collocation|phrasalVerb|idiom|chunk','meaningId[]','CEFR','headLemmaIds[]','pattern','separable?','register','usageNotesId','baseValue','examples[]'],
  features:['Natural word combinations','Phrasal verb separability','Lexical chunks for fluency'],
  formula:'baseValue = cefrBase × phraseComplexity × usagePriority',
  tags:'phrase collocation phrasal verb idiom chunk natural english'});
N('grammar','Grammar / Usage Entity','ENTITY','LANGUAGE ENTITY','english/grammar','canonical draft','GrammarRecord','CORE',{
  fields:['id','pattern','CEFR','form','function','tenseAspect?','constraints','contrastId','commonTransferErrors[]','register','baseValue','examples[]'],
  features:['Form + meaning + use','Contrast with Indonesian structure','Common learner-error hooks'],
  formula:'baseValue = cefrBase × structuralComplexity × productionWeight',
  tags:'grammar tense aspect article preposition usage indonesia transfer'});
N('pronunciation','Pronunciation Entity','ENTITY','LANGUAGE ENTITY','english/pronunciation','word / phrase identity','PronunciationRecord','CORE',{
  fields:['id','entityId','ipaUS?','ipaUK?','syllables[]','wordStress','phonemes[]','minimalPairIds[]','audioRefs[]','indoDifficultyTags[]','baseValue'],
  features:['IPA optional display','Word stress','Minimal pairs','Indonesian-specific difficult sounds'],
  tags:'pronunciation ipa stress th dh v f vowel minimal pair speaking'});
N('sentence','Sentence / Example Entity','ENTITY','LANGUAGE ENTITY','english/sentence','linked vocab + phrase + grammar','SentenceRecord','CORE',{
  fields:['id','english','indonesian','tokenEntityIds[]','phraseIds[]','grammarIds[]','CEFR','context','naturalness','audioRef?','baseValue'],
  features:['Context-bearing example','Bilingual alignment','Reusable across listening/reading/translation/speaking'],
  tags:'sentence example english indonesian translation context'});

/* ============================ ENGINES ============================ */
N('flashcard_engine','Flashcard / Recall Engine','ENGINE','ENGINES','engine/flashcard','Vocabulary / Phrase / Grammar','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:0.70,
  features:['EN → ID recall','ID → EN production','Definition mode','Example-cloze mode','Known / unsure / missed','Timed recall'],
  scorePort:'recallRating, direction, responseMs, score',
  attemptPort:'reviewCount +1, durationMs, interaction=flashcard',
  errorPort:'missedMeaning / wrongSense / slowRecall',
  formula:'engineScore = baseValue × 0.70 × recallFactor × directionFactor',
  tags:'flashcard vocabulary recall indonesia meaning multiplier'});
N('spelling_engine','Spelling / Writing Engine','ENGINE','ENGINES','engine/spelling','Vocabulary / Phrase / Sentence','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.05,
  features:['Listen → type','ID meaning → type English','Missing-letter drill','Word segmentation','Sentence typing'],
  scorePort:'editSimilarity, exactMatch, responseMs, score',
  attemptPort:'spellingCount +1, typedChars, durationMs',
  errorPort:'spellingError / apostrophe / wordBoundary / capitalization',
  formula:'engineScore = baseValue × 1.05 × spellingAccuracy',
  tags:'spelling writing typing dictation english'});
N('verb_engine','Verb Form · Tense · Aspect Engine','ENGINE','ENGINES','engine/verb-forms','Vocabulary(verb) + Grammar','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.40,
  features:['Base → past → participle → -ing','Irregular verb recall','Tense/aspect selection','Auxiliary selection','Affirmative / negative / question transforms'],
  scorePort:'correctForm, tenseAspect, auxiliary, responseMs, score',
  attemptPort:'verbFormCount +1, transformCount +1, durationMs',
  errorPort:'wrongVerbForm / tenseMismatch / auxiliaryError / SVAError',
  formula:'engineScore = baseValue × 1.40 × correctness × transformDifficulty',
  tags:'verb tense aspect conjugation perubahan kata past participle auxiliary'});
N('grammar_engine','Grammar Usage Engine','ENGINE','ENGINES','engine/grammar','Grammar + Vocabulary + Sentence','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.35,
  features:['Article a/an/the','Subject–verb agreement','Do/be distinction','Plural & countability','Preposition choice','Question formation','Relative clause / modal / conditionals'],
  scorePort:'ruleAccuracy, usageAccuracy, responseMs, score',
  attemptPort:'grammarAttemptCount +1, durationMs',
  errorPort:'articleError / SVAError / doBeError / prepositionError / countabilityError / wordOrder',
  formula:'engineScore = baseValue × 1.35 × formMeaningUseAccuracy',
  tags:'grammar article sva do be preposition countable indonesia error'});
N('sentence_engine','Sentence Builder / Production Engine','ENGINE','ENGINES','engine/sentence-builder','Vocabulary + Phrase + Grammar + Sentence','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.65,
  features:['Word ordering','Free sentence build','Required-word challenge','Grammar constraint validation','Naturalness / collocation check','Meaning preservation'],
  scorePort:'grammarScore, lexicalScore, naturalnessScore, semanticScore, totalScore',
  attemptPort:'sentenceBuildCount +1, producedWords, durationMs',
  errorPort:'wordOrder / missingArticle / unnaturalCollocation / agreement / missingFunctionWord',
  formula:'engineScore = baseValueSum × 1.65 × productionQuality',
  tags:'sentence builder production word order naturalness english'});
N('translation_engine','ID ↔ EN Translation Engine','ENGINE','ENGINES','engine/translation','Vocabulary + Phrase + Grammar + Sentence','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.50,
  features:['Indonesian → English production','English → Indonesian comprehension','Meaning equivalence','Literal-translation detection','Multiple valid answer support'],
  scorePort:'semanticScore, grammarScore, naturalnessScore, direction, totalScore',
  attemptPort:'translationCount +1, directionCount, durationMs',
  errorPort:'literalTranslation / falseFriend / omittedSubject / tenseTransfer / unnaturalPhrase',
  formula:'engineScore = baseValueSum × 1.50 × semanticFidelity × naturalness',
  tags:'translation indonesia english literal translation false friend'});
N('listening_engine','Listening / Dictation Engine','ENGINE','ENGINES','engine/listening','Pronunciation + Vocabulary + Sentence + audio','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.35,
  features:['Listen → meaning','Listen → type','Keyword recognition','Reduced speech','Replay count','Speed/accent variation'],
  scorePort:'comprehensionScore, dictationSimilarity, replayCount, score',
  attemptPort:'listeningCount +1, replayCount, listenMs',
  errorPort:'phonemeConfusion / missedFunctionWord / segmentationError / reducedSpeech',
  formula:'engineScore = baseValue × 1.35 × listeningAccuracy × replayPenalty',
  tags:'listening dictation audio accent reduced speech'});
N('speaking_engine','Pronunciation / Speaking Engine','ENGINE','ENGINES','engine/speaking','Pronunciation + Vocabulary + Phrase + Sentence','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.75,
  features:['Listen & repeat','Minimal-pair drill','Word stress','Sentence shadowing','Read aloud','Free spoken response'],
  scorePort:'phonemeScore, stressScore, fluencyScore, intelligibilityScore, totalScore',
  attemptPort:'speakingCount +1, spokenMs, recordedUtterances +1',
  errorPort:'thSubstitution / vFConfusion / vowelLength / stressError / finalConsonant / clusterReduction',
  formula:'engineScore = baseValueSum × 1.75 × intelligibility × pronunciationQuality',
  tags:'speaking pronunciation indonesia th v f stress vowel shadowing'});
N('reading_engine','Reading Comprehension Engine','ENGINE','ENGINES','engine/reading','Vocabulary + Phrase + Grammar + Sentence/Text','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:1.20,
  features:['Main idea','Detail','Inference','Reference words','Vocabulary in context','Reading speed'],
  scorePort:'comprehensionScore, wpm, responseMs, score',
  attemptPort:'readingCount +1, readingMs, wordsRead',
  errorPort:'contextMismatch / referenceError / inferenceError / lexicalGuessError',
  formula:'engineScore = baseValueSum × 1.20 × comprehension × levelFactor',
  tags:'reading comprehension context inference wpm'});
N('recall_engine','Smart Recall / SRS Engine','ENGINE','ENGINES','engine/recall','Entity + SRS schedule','ResultEvent + ActivityEvent','ENGINE',{
  multiplier:0.90,
  features:['Due queue','Weak-item priority','Mix receptive/productive directions','Confidence rating','Lapse handling','Interleave skills'],
  scorePort:'recallQuality, score, previousInterval, direction',
  attemptPort:'reviewCount +1, lapseCount?, durationMs',
  errorPort:'lapse / lowConfidence / repeatedSameError',
  formula:'engineScore = baseValue × 0.90 × recallQuality',
  tags:'srs smart recall review spaced repetition'});

/* ========================= EVENT ROUTER ========================= */
N('result_event','Result Event Port','EVENT','EVENT ROUTER','event/result','engine result payload','normalized ResultEvent','EVENT',{
  fields:['eventId','entityIds[]','engineId','baseValueSum','multiplier','rawScore','accuracy','durationMs','CEFR','timestamp','contextId?'],
  features:['One result format across engines','Immutable evidence','Supports multi-entity tasks'],
  tags:'score result event output value'});
N('activity_event','Activity / Attempt Port','EVENT','EVENT ROUTER','event/activity','engine activity payload','normalized ActivityEvent','EVENT',{
  fields:['eventId','entityIds[]','engineId','actionType','attemptDelta','durationMs','skill','timestamp','sessionId'],
  features:['Frequency separated from score','Daily/weekly/monthly counters','Per-engine and per-skill counts'],
  tags:'attempt count activity frequency berapa kali melakukan'});
N('error_event','Learner Error Port','EVENT','EVENT ROUTER','event/error','engine detected error','ErrorEvent','EVENT',{
  fields:['entityIds[]','engineId','errorType','severity','skill','sourceLanguageTransfer?','context','timestamp'],
  tags:'error learner mistake indonesia transfer'});
N('score_engine','Score & Reward Calculator','PROCESS','EVENT ROUTER','engine/scoring','ResultEvent','FinalScoreEvent','CORE',{
  features:['Apply engine multiplier','Accuracy/quality factor','CEFR difficulty factor','Production bonus','Speed bonus optional','Repeat-farming dampener','Clamp & anti-abuse'],
  formula:'finalScore = baseValueSum × engineMultiplier × quality × cefrDifficulty × productionBonus × noveltyFactor − penalty',
  scorePort:'finalScore, masteryDelta, expDelta, skillDelta',
  tags:'score reward multiplier exp calculation'});
N('activity_counter','Activity Counter','PROCESS','EVENT ROUTER','engine/activity-counter','ActivityEvent','ActivityDelta','CORE',{
  fields:['totalAttempts','byEngine{}','bySkill{}','byEntity{}','byCEFR{}','studyMinutes','spokenMinutes','wordsRead','sentencesProduced','reviewsToday'],
  formula:'counter[key] += attemptDelta; duration += durationMs',
  tags:'activity counter attempts study minutes speaking count'});
N('error_classifier','Indonesian Learner Error Classifier','PROCESS','EVENT ROUTER','engine/error-classifier','ErrorEvent[]','ErrorPattern[]','CORE',{
  features:['Article omission','Subject–verb agreement','Do/be confusion','Tense/aspect transfer','Plural/countability','Preposition','Word order','Literal translation','False friends','Collocation','Pronunciation phoneme/stress'],
  formula:'patternStrength = frequency × recency × severity × crossEngineEvidence',
  tags:'indonesian learner error classifier article tense literal translation pronunciation'});

/* ======================== LEARNING STATE ======================== */
N('mastery','Multi-Skill Mastery Engine','STATE','LEARNING STATE','state/mastery','FinalScoreEvent + ErrorPattern + history','EntityMastery + SkillMastery','STATE',{
  fields:['overallMastery','receptiveMastery','productiveMastery','listeningMastery','speakingMastery','readingMastery','writingMastery','accuracyEMA','attempts','successes','fails','engineCoverage','lastSeenAt','confidence'],
  features:['Per entity + per skill mastery','Receptive ≠ productive mastery','Cross-engine evidence','Diminishing return','Recency/decay optional'],
  formula:'masteryNext = f(previous, finalScore, skill, productionWeight, recency, engineDiversity, errorPenalty)',
  tags:'mastery skill receptive productive speaking listening reading writing'});
N('activity_stats','Activity / Exposure Stats','STATE','LEARNING STATE','state/activity','ActivityDelta','ActivityStats','STATE',{
  fields:['totalActions','byEngine{}','bySkill{}','studyMinutes','speakingMinutes','listeningMinutes','wordsRead','sentencesProduced','uniqueEntities','daily[]','weekly[]','streakDays'],
  tags:'activity stats exposure attempts streak minutes'});
N('srs_schedule','SRS Scheduler','STATE','LEARNING STATE','state/srs','EntityMastery + recall quality + direction','nextReviewAt + interval + nextMode','STATE',{
  features:['Interval update','Due queue','Lapse reset','Difficulty modifier','Switch EN→ID to ID→EN when ready','Promote to production task'],
  formula:'nextInterval,nextMode = schedule(previousInterval, recallQuality, productiveMastery, errorPattern)',
  tags:'srs schedule next review productive recall'});
N('player_reward','Player Reward / XP State','STATE','LEARNING STATE','state/player-reward','FinalScoreEvent','EXP / coins / CEFR progress points','STATE',{
  fields:['totalExp','coins','cefrPoints','dailyExp','skillExpBreakdown','engineExpBreakdown'],
  tags:'exp reward cefr points player state'});
N('cefr_profile','CEFR Skill Profile','STATE','LEARNING STATE','state/cefr-profile','mastery + assessed evidence','A1–C2 skill estimates','STATE',{
  fields:['overallBand','vocabularyBand','grammarBand','listeningBand','speakingBand','readingBand','writingBand','evidenceCoverage','confidence'],
  features:['Do not promote from EXP alone','Require skill evidence','Can show uneven profile, e.g. Reading B1 / Speaking A2'],
  formula:'band(skill) = threshold(weightedMastery, coverage, recentAssessment)',
  tags:'cefr a1 a2 b1 b2 c1 c2 level profile'});

/* ========================= PERSISTENCE ========================= */
N('local_store','Local Session Cache','PERSIST','PERSISTENCE','localStorage / IndexedDB','state snapshots + event queue','offline cache','STORAGE',{
  features:['Instant resume','Offline-first','Pending event queue','Safe retry'],
  tags:'local storage indexeddb cache'});
N('cloud_store','Cloud English Learner Profile','PERSIST','PERSISTENCE','Supabase / API','mastery + activity + errors + CEFR + rewards','cross-device profile','STORAGE',{
  fields:['user_mastery','user_skill_mastery','user_activity','user_errors','user_scores','user_cefr_profile','user_rewards','event_log'],
  features:['Merge-safe collections','Server timestamps','Audit event log','Cross-device continuity'],
  tags:'cloud supabase profile persistence english'});

/* ======================= PROGRESSION / UI ======================= */

  ${d.fields?`<h3>DATA FIELDS</h3>${list(d.fields)}`:''}${d.features?`<h3>FEATURES / RULES</h3>${list(d.features)}`:''}${d.formula?`<h3>FORMULA</h3><div class="formula">${esc(d.formula)}</div>`:''}${portCards?`<h3>ENGINE PORTS</h3><div class="portbox">${portCards}</div>`:''}`;
  $('#panel').classList.add('open');applyHighlight();
}
$('#close').onclick=()=>{$('#panel').classList.remove('open');selected=null;applyHighlight()};
function setT(){canvas.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`;vp.style.backgroundPosition=`${T.x}px ${T.y}px`;vp.style.backgroundSize=`${32*T.k}px ${32*T.k}px`}
function barH(){return document.getElementById('top').offsetHeight}
function place(){const h=barH();$('#note').style.top=(h+8)+'px';$('#panel').style.paddingTop=(h+14)+'px';$('#close').style.top=(h+14)+'px'}
function fit(){place();const ids=Object.keys(nodeEls);if(!ids.length)return;const V=VIEWS[view];let x1=1e9,y1=1e9,x2=0,y2=0;ids.forEach(id=>{const[x,y]=V.pos[id];x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x+270);y2=Math.max(y2,y+190)});const BH=barH(),w=innerWidth,h=innerHeight-BH,k=Math.min(1,Math.min(w/(x2-x1+120),h/(y2-y1+120)));T.k=Math.max(.16,k);T.x=(w-(x2-x1)*T.k)/2-x1*T.k;T.y=BH+(h-(y2-y1)*T.k)/2-y1*T.k;setT()}
let drag=null;vp.addEventListener('mousedown',e=>{$('#note').style.display='none';if(e.target.closest('.node'))return;drag={x:e.clientX-T.x,y:e.clientY-T.y};vp.classList.add('drag')});addEventListener('mousemove',e=>{if(!drag)return;T.x=e.clientX-drag.x;T.y=e.clientY-drag.y;setT()});addEventListener('mouseup',()=>{drag=null;vp.classList.remove('drag')});vp.addEventListener('wheel',e=>{$('#note').style.display='none';e.preventDefault();const f=e.deltaY<0?1.1:1/1.1,nk=Math.min(2.25,Math.max(.14,T.k*f)),px=e.clientX,py=e.clientY;T.x=px-(px-T.x)*(nk/T.k);T.y=py-(py-T.y)*(nk/T.k);T.k=nk;setT()},{passive:false});
let touch=null;vp.addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('.node'))touch={x:e.touches[0].clientX-T.x,y:e.touches[0].clientY-T.y}});vp.addEventListener('touchmove',e=>{if(touch&&e.touches.length===1){T.x=e.touches[0].clientX-touch.x;T.y=e.touches[0].clientY-touch.y;setT()}});vp.addEventListener('touchend',()=>touch=null);
$('#zin').onclick=()=>{T.k=Math.min(2.25,T.k*1.2);setT()};$('#zout').onclick=()=>{T.k=Math.max(.14,T.k/1.2);setT()};$('#zfit').onclick=fit;
canvas.addEventListener('click',e=>{const n=e.target.closest('.node');if(n)openPanel(n.dataset.id)});$('#views').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;$('#panel').classList.remove('open');selected=null;buildControls();render();fit()});$('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;buildControls();applyHighlight()});$('#search').addEventListener('input',e=>{q=e.target.value;if(q.trim()){const t=q.toLowerCase(),inView=Object.keys(nodeEls).some(id=>matches(NODES[id],t));if(!inView){const alt=Object.keys(VIEWS).find(v=>Object.keys(VIEWS[v].pos).some(id=>NODES[id]&&matches(NODES[id],t)));if(alt){view=alt;buildControls();render();fit();return}}}applyHighlight()});addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#search')){e.preventDefault();$('#search').focus()}if(e.key==='Escape')$('#close').click()});addEventListener('resize',fit);
buildLegend();buildControls();render();fit();
</script>
